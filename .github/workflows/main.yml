name: luma.oled

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-minor-version: [10, 11, 12, 13, 14, 15, 16-dev]
    name: Python 3.${{ matrix.python-minor-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install graphviz -y
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.${{ matrix.python-minor-version }}
          check-latest: true
          cache: 'pip'
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install Python packages
        run: pip install --upgrade setuptools pip wheel tox coveralls
      - name: Run tests
        env:
          TOX_ENV: py3${{ matrix.python-minor-version }}
        run: |
          python_env=$(echo $TOX_ENV | sed -e s/-dev$//)
          python -m tox -e ${python_env}
      - name: QA
        env:
          TOX_ENV: qa,doc
        run: python -m tox -e $TOX_ENV
      - name: Coverage
        run: coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_FLAG_NAME: luma.oled
          COVERALLS_PARALLEL: true

  coveralls:
    name: Coveralls
    needs: build
    runs-on: ubuntu-latest
    container: python:3-slim
    steps:
    - name: Finished
      run: |
        pip3 install --upgrade coveralls
        coveralls --finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
